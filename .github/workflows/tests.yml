# Draait de Playwright-tests bij elke pull request (CI).
# Na een merge naar main roept deploy-test.yml deze workflow aan vóór de deploy naar TEST.
# In plaats van XAMPP: een MariaDB-container en de ingebouwde PHP-server.
name: Tests

on:
  pull_request:
  workflow_call:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:11
        env:
          # Wegwerpgegevens: deze database bestaat alleen tijdens de testrun
          MARIADB_DATABASE: vibe_webshop
          MARIADB_USER: webshop
          MARIADB_PASSWORD: webshop
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      BASE_URL: http://127.0.0.1:8000/
      PHP_BIN: php
      PHP_CLI_SERVER_WORKERS: 4

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: config.php aanmaken
        run: sed "s/'VUL_IN'/'webshop'/g" config.example.php > config.php

      - name: Database vullen
        run: mysql -h 127.0.0.1 -u webshop -pwebshop --default-character-set=utf8mb4 vibe_webshop < database/schema.sql

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
